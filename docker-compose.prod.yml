# Production stack: Postgres + API + Web (no bind mounts, built images).
# Usage: bun run docker:prod:build && bun run docker:prod:up
# Or: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suki
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No port exposure by default for prod; expose only if needed for local smoke tests
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/suki
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    # Expose for local prod smoke test; remove or use reverse proxy in real deployment
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data_prod:
